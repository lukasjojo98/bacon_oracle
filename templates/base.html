<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon oracle</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html, body {
            background-color: #F1E2D1;
            height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
            color: #222;
        }
        .nav-bar {
            height: 50px;
            background-color: #810B38;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }
        main {
            min-height: calc(100vh - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .search-form {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 220px;
            font-size: 14px;
        }
        .search-separator {
            margin: 0;
            font-size: 16px;
            color: #333;
        }
        .search-button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background-color: #333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .loading {
            margin-left: 10px;
            font-style: italic;
            color: #333;
        }
        .loading .dots {
            display: inline-block;
            width: 2ch;
        }
        .connection-container {
            display: flex;
            justify-content: center;
            margin: 20px auto;
            width: fit-content;
            flex-direction: column;
            align-items: center;
        }
        .connection-item {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            display: flex;
            width: fit-content;
            flex-direction: column;
            justify-self: center;
        }
        .arrow-item {
            padding: 20px;
            display: flex;
            width: fit-content;
            flex-direction: column;
            justify-self: center;
        }
        .button-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .button-container p { margin: 0; }
        .button-container button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
        }
        .connection-item p {
            margin: 5px 0;
            background-color: #f9f9f9;
        }

        /* Responsive adjustments for small screens */
        @media (max-width: 600px) {
            :root { font-size: 16px; }
            .nav-bar { height: 56px; font-size: 18px; padding: 0 12px; }
            main { padding: 12px; }
            .search-row { flex-direction: column; gap: 8px; align-items: stretch; }
            .search-input { min-width: 0; width: 100%; }
            .search-button { width: 100%; }
            .connection-container { width: 100%; margin: 12px auto; padding: 0 8px; }
            .connection-item, .arrow-item { width: 100%; box-sizing: border-box; margin: 10px 0; padding: 14px; }
            .button-container { flex-direction: column; gap: 8px; align-items: stretch; }
            .button-container button { width: 100%; }
            .loading { display: inline-block; }
        }
    </style>
</head>
<body>
    <div class="nav-bar"><a href="/">The oracle of Bacon</a></div>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="../static/button-logic.js"></script>
</body>
</html>
